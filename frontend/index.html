<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Toolbox</title>
    <!-- 首帧同步应用主题：默认暗色，用上次缓存覆盖，避免等待后端配置时的闪屏 -->
    <script>
      ;(() => {
        const root = document.documentElement
        const cached = (() => {
          try {
            return localStorage.getItem('toolbox-theme')
          } catch {
            return null
          }
        })()
        const theme = cached === 'light' || cached === 'midnight' || cached === 'idea'
          ? cached
          : 'dark'
        try {
          localStorage.setItem('toolbox-theme', theme)
        } catch {
          /* localStorage 不可用时忽略 */
        }
        root.dataset.theme = theme
        if (theme !== 'light') {
          root.classList.add('dark')
        }
      })()
    </script>
    <!--
      启动占位样式：刻意内联且不依赖任何外部资源。
      JS / CSS 打包产物加载完成前（dev 模式需数百毫秒），
      浏览器首帧就能画出这个占位，避免出现空白窗口。
    -->
    <style>
      html, body {
        margin: 0;
        height: 100%;
      }

      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f1f5f9;
        color: #1e293b;
        font-family: "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
      }

      html.dark #boot-splash {
        background: #0f172a;
        color: #e2e8f0;
      }

      .boot-spinner {
        width: 28px;
        height: 28px;
        border: 2px solid rgba(56, 189, 248, 0.25);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .boot-title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .boot-hint {
        font-size: 11px;
        opacity: 0.6;
      }

      /*
       * 背景层：窗口为透明类型，底色与磨砂都作用在这一层。
       * 这里给出默认的不透明兜底（跟随首帧主题），
       * 等 global.css 加载后由 CSS 变量接管透明度与模糊。
       */
      #app-backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }

      html[data-theme='dark'] #app-backdrop {
        background: #0f172a;
      }

      html[data-theme='midnight'] #app-backdrop {
        background: #0a0a0c;
      }

      html[data-theme='idea'] #app-backdrop {
        background: #2b2b2b;
      }

      html[data-theme='light'] #app-backdrop {
        background: #f1f5f9;
      }

      #boot-splash,
      html[data-theme='dark'] #boot-splash {
        background: #0f172a;
        color: #e2e8f0;
      }

      html[data-theme='midnight'] #boot-splash {
        background: #0a0a0c;
        color: #e8e8ea;
      }

      html[data-theme='idea'] #boot-splash {
        background: #2b2b2b;
        color: #d6d6d6;
      }

      html[data-theme='light'] #boot-splash {
        background: #f1f5f9;
        color: #1e293b;
      }
    </style>
</head>
<body>
<!-- 窗口背景层：位于 #app 之下，承载底色与磨砂 -->
<div id="app-backdrop" aria-hidden="true"></div>

<!-- Vue 挂载时会清空 #app，启动占位自动消失，无需手动移除 -->
<div id="app">
    <div id="boot-splash">
        <div class="boot-spinner"></div>
        <div class="boot-title">Toolbox</div>
        <div class="boot-hint">正在启动…</div>
    </div>
</div>
<!--
  Wails v3 的 runtime 通过 npm 包 @wailsio/runtime 引入
  （由 src/api/runtime.ts 与生成的绑定 import 触发），
  无需在此加载 /wails/runtime.js；直接加载反而会让
  vite 在独立启动时因找不到该路径而报错。
-->
<script src="./src/main.ts" type="module"></script>
</body>
</html>
